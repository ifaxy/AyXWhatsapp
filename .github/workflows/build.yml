name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          install_pkgs() {
            sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          }
          n=0
          until install_pkgs; do
            n=$((n+1))
            if [ $n -ge 4 ]; then echo "sdkmanager failed after $n attempts"; exit 1; fi
            echo "sdkmanager failed (attempt $n) - clearing partial NDK download and retrying..."
            rm -rf "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/26.3.11579264" 2>/dev/null || true
            sleep 8
          done
          test -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/26.3.11579264" || { echo "NDK missing after install"; exit 1; }

      - name: Download nodejs-mobile (digidem) and place libnode.so
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/digidem/nodejs-mobile/releases?per_page=15" \
              | grep browser_download_url \
              | grep -- '-android-' \
              | grep -v lite \
              | grep '\.zip' \
              | head -n1 | cut -d '"' -f4)
          if [ -z "$URL" ]; then echo "No android asset found"; exit 1; fi
          echo "Downloading $URL"
          curl -sL -o node.zip "$URL"
          mkdir -p _node && unzip -q node.zip -d _node
          SO=$(find _node -path '*arm64-v8a*' -name 'libnode.so' | head -n1)
          echo "libnode.so: $SO"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$SO" app/src/main/jniLibs/arm64-v8a/libnode.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Install node deps and bundle project into assets
        run: |
          set -e
          cd nodejs-project
          npm install --omit=dev --no-audit --no-fund
          cd ..
          mkdir -p app/src/main/assets
          ( cd nodejs-project && zip -qr ../app/src/main/assets/nodejs-project.zip . -x '*.git*' )
          ls -la app/src/main/assets/
          du -sh app/src/main/assets/nodejs-project.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode signing keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/ayx.keystore"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/ayx.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.KEYSTORE_B64 != ''
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish signed release APK
        if: env.KEYSTORE_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: Signed release
          files: app/build/outputs/apk/release/app-release.apk
